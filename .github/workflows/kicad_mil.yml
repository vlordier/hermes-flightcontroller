name: MIL-Grade KiCad CI

# Provides MIL-STD-461/704/1275 pre-compliance checks in CI:
#   • ERC/DRC with custom MIL DRC rules (.kicad_dru)
#   • KiBot exports with traceability & derating notes
#   • SPICE power / transient / CS-like simulations (MIL-STD-461 CS116)
#   • OpenEMS FDTD electromagnetic simulation (RE102 / RS103 approximation)
#   • Automated MIL compliance checklist report

on:
  push:
    branches: [main, develop]
    paths: ['PCB/**']
  pull_request:
    paths: ['PCB/**']

# ── Shared defaults ───────────────────────────────────────────────────────────
env:
  SCH:  PCB/HermesFC/HermesFC.kicad_sch
  PCB:  PCB/HermesFC/HermesFC.kicad_pcb
  DRU:  PCB/HermesFC/mil_rules.kicad_dru

# ─────────────────────────────────────────────────────────────────────────────
jobs:

  # ── 1. ERC / DRC (with MIL custom rules) ─────────────────────────────────
  erc-drc:
    name: ERC / DRC (MIL rules)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: ghcr.io/inti-cmnb/kicad_auto:ki8

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Run ERC
        run: |
          kicad-cli sch erc \
            --output erc_report.txt \
            "$SCH"

      - name: Run DRC (with MIL rules overlay)
        run: |
          kicad-cli pcb drc \
            --output drc_report.txt \
            "$PCB"
        # The .kicad_dru file is automatically picked up by KiCad when it
        # lives next to the .kicad_pcb file; constraints are merged at runtime.

      - name: Upload ERC/DRC reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mil-erc-drc-reports
          path: |
            erc_report.txt
            drc_report.txt

  # ── 2. KiBot MIL exports ──────────────────────────────────────────────────
  kibot-exports:
    name: KiBot MIL Exports
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: ghcr.io/inti-cmnb/kicad_auto:ki8

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Generate MIL Outputs with KiBot
        run: |
          kibot -c PCB/kibot_mil.yaml \
                -d mil_output \
                -b "$PCB" \
                -e "$SCH"
        continue-on-error: true

      - name: Upload MIL Manufacturing Files
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mil-manufacturing-files
          path: mil_output/

  # ── 3. SPICE simulation (MIL-STD-461 CS / conducted) ─────────────────────
  spice-simulation:
    name: SPICE / MIL-STD-461 Power Sim
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: ghcr.io/inti-cmnb/kicad_auto:ki8

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install simulation tools
        # Container runs as root — no sudo needed.
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            ngspice python3 python3-numpy python3-scipy python3-matplotlib

      - name: Export SPICE Netlist
        run: |
          kicad-cli sch export netlist \
            --format spice \
            --output sim.net \
            "$SCH"
        continue-on-error: true

      - name: Run MIL-STD-461 CS116-like transient simulation
        # Uses dedicated .cir files (CS116 damped-sinusoid injection source).
        # Falls back gracefully when SPICE models are not yet present.
        run: |
          if [ -f sim.net ]; then
            # Merge netlist with MIL transient control file (if present)
            if [ -f PCB/sim/mil_cs116.cir ]; then
              cat PCB/sim/mil_cs116.cir sim.net > mil_sim_full.cir
            else
              cp sim.net mil_sim_full.cir
            fi
            ngspice -b -o sim_output.txt mil_sim_full.cir || true
          else
            echo "No SPICE netlist — skipping simulation." | tee sim_output.txt
          fi
        continue-on-error: true

      - name: Check MIL SPICE results
        run: python3 scripts/check_mil_spice.py sim_output.txt
        continue-on-error: true

      - name: Upload simulation outputs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mil-spice-results
          path: |
            sim_output.txt
            mil_sim_full.cir

  # ── 4. OpenEMS FDTD EM simulation (RE102 / RS103 approximation) ──────────
  em-simulation:
    name: OpenEMS EM Simulation (RE/RS)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Run on bare ubuntu-latest (not in container) so we can use apt freely.

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install OpenEMS & gerber2ems
        run: |
          set -x
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            software-properties-common wget gnupg python3-pip python3-setuptools \
            python3-dev gcc g++ git python3-venv
          # Use official installer script for openEMS (works on Ubuntu 20.04/22.04/24.04)
          wget -qO- https://openems.de/download/install_openEMS.sh | sudo bash -s -- --python
          # Use a virtual environment to avoid conflicting with system-managed packages
          python3 -m venv /opt/simulation-venv
          /opt/simulation-venv/bin/pip install --quiet git+https://github.com/drufat/triangle.git@master
          /opt/simulation-venv/bin/pip install --quiet git+https://github.com/antmicro/gerber2ems.git
          # Add venv to PATH for subsequent steps
          echo "/opt/simulation-venv/bin" >> $GITHUB_PATH
          set +x

      - name: Convert Gerbers to OpenEMS model
        run: |
          # Attempt gerber2ems conversion; skip cleanly if tool is unavailable.
          # No stub files are created — the FDTD step detects an empty/missing
          # model directory and exits gracefully.
          if command -v gerber2ems >/dev/null 2>&1; then
            gerber2ems \
              -i PCB/HermesFC/manufacturing/ \
              -o em_sim/ \
              --layers F.Cu,B.Cu,In1.Cu,In2.Cu
          else
            echo "gerber2ems not available — skipping Gerber-to-openEMS conversion."
          fi
        continue-on-error: true

      - name: Run FDTD simulation & MIL-461 field check
        run: python3 scripts/run_openems.py --check-mil461
        continue-on-error: true

      - name: Upload EM simulation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mil-em-sim-results
          path: em_sim/

  # ── 5. PCB & BOM physical checks ─────────────────────────────────────────
  pcb-bom-checks:
    name: PCB & BOM Physical Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Run PCB physical checks (MIL-STD-275E / IPC-2221A)
        # Parses .kicad_pcb directly — no KiCad installation needed.
        # Checks: 4-layer stackup, GND zone on inner layers, via drills >= 0.3 mm,
        # track widths on signal layers >= 0.25 mm, GND stitching via count.
        run: |
          python3 scripts/check_pcb.py "$PCB"
        continue-on-error: true

      - name: Run BOM validation (LCSC coverage, TVS/ESD, power ICs)
        # Parses manufacturing/bom.csv — no KiCad installation needed.
        # Checks: LCSC part numbers for all parts, TVS/ESD protection present,
        # sufficient decoupling capacitors, no empty value fields.
        run: |
          python3 scripts/check_bom.py PCB/HermesFC/manufacturing/bom.csv

      - name: Upload PCB/BOM check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mil-pcb-bom-reports
          path: |
            erc_report.txt
            drc_report.txt

  # ── 6. MIL compliance checklist ──────────────────────────────────────────
  mil-checklist:
    name: MIL Compliance Checklist
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [erc-drc, spice-simulation, em-simulation, pcb-bom-checks]
    if: always()

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Download ERC/DRC reports
        uses: actions/download-artifact@v4
        with:
          name: mil-erc-drc-reports
          path: reports/
        continue-on-error: true

      - name: Download SPICE results
        uses: actions/download-artifact@v4
        with:
          name: mil-spice-results
          path: reports/
        continue-on-error: true

      - name: Download EM sim results
        uses: actions/download-artifact@v4
        with:
          name: mil-em-sim-results
          path: reports/em_sim/
        continue-on-error: true

      - name: Install Python deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3 python3-pip
          python3 -m pip install doorstop pydantic pydantic-settings sexpdata --break-system-packages

      - name: Verify Requirements Traceability (Doorstop)
        run: |
          doorstop publish REQ reqs/system/REQ.html
          doorstop publish SPEC reqs/hardware/SPEC.html

      - name: Generate MIL Compliance Report
        # Runs check_pcb.py and check_bom.py internally for real-time results;
        # aggregates ERC/DRC/SPICE/EM artifact results where present.
        run: |
          python3 scripts/mil_checklist.py \
            --report mil_compliance.md \
            --pcb "$PCB" \
            --bom PCB/HermesFC/manufacturing/bom.csv

      - name: Generate PR Summary
        run: python3 .github/scripts/generate_compliance_summary.py

      - name: Upload MIL Compliance Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mil-compliance-report
          path: |
            mil_compliance.md
            reqs/**/*.html
