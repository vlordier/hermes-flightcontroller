name: Lint & Test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  markdownlint:
    name: Markdown lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: "**/*.md"
          config: ".markdownlint.json"

  python-quality:
    name: Python Quality (Ruff, MyPy, Pytest)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run Ruff check
        run: uv run ruff check scripts/ tests/

      - name: Run Ruff format (check only)
        run: uv run ruff format --check scripts/ tests/

      - name: Run MyPy
        run: uv run mypy scripts/

      - name: Run tests with coverage
        run: uv run pytest tests/ --cov=scripts --cov-report=term-missing --cov-fail-under=60
