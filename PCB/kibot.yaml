kibot:
  version: 1

preflight:
  # ERC and DRC are already run via kicad-cli steps; disable here to avoid
  # duplicate failures in the KiBot run.
  run_erc: false
  run_drc: false
  ignore_unconnected: false

outputs:
  # ── Gerber files (JLCPCB-compatible) ────────────────────────────────────────
  - name: gerbers
    comment: Gerber files for PCB fabrication
    type: gerber
    dir: gerbers
    options:
      exclude_edge_layer: true
      exclude_pads_from_silkscreen: false
      plot_sheet_reference: false
      plot_footprint_refs: true
      plot_footprint_values: true
      force_plot_invisible_refs_vals: false
      tent_vias: true
      use_protel_extensions: false
      gerber_precision: 4.6
      create_gerber_job_file: true
      use_gerber_x2_attributes: true
      use_gerber_net_attributes: true
    layers:
      - F.Cu
      - B.Cu
      - In1.Cu
      - In2.Cu
      - F.SilkS
      - B.SilkS
      - F.Mask
      - B.Mask
      - Edge.Cuts

  # ── Drill files ──────────────────────────────────────────────────────────────
  - name: drill
    comment: Drill/route files
    type: excellon
    dir: gerbers
    options:
      map: gerber
      pth_and_npth_single_file: false

  # ── Bill of Materials ────────────────────────────────────────────────────────
  - name: bom_csv
    comment: Bill of Materials (CSV with LCSC part numbers)
    type: bom
    dir: bom
    options:
      output: '%f_BOM.%x'
      ref_separator: ','
      group_components: true
      sort_style: type_value
      columns:
        - field: References
          name: References
        - field: Value
          name: Value
        - field: Quantity Per PCB
          name: Qty
        - Description
        - Footprint
        - field: 'LCSC Part #'
          name: 'LCSC Part #'

  # ── Schematic PDF ────────────────────────────────────────────────────────────
  - name: schematic_pdf
    comment: Schematic PDF export
    type: pdf_sch_print
    dir: docs

  # ── PCB layout PDF ───────────────────────────────────────────────────────────
  - name: pcb_pdf
    comment: PCB layout PDF (all copper layers)
    type: pdf_pcb_print
    dir: docs
    options:
      plot_sheet_reference: false
    layers:
      - layer: F.Cu
      - layer: B.Cu
      - layer: In1.Cu
      - layer: In2.Cu
      - layer: Edge.Cuts

  # ── Pick-and-place / assembly (generic) ─────────────────────────────────────
  - name: position
    comment: Component placement file (pick-and-place, all layers)
    type: position
    dir: assembly
    options:
      format: CSV
      units: millimeters
      separate_files_for_front_and_back: false

  # ── JLCPCB SMT assembly outputs ──────────────────────────────────────────────
  # JLCPCB BOM requires: Comment, Designator, Footprint, LCSC Part #
  - name: jlcpcb_bom
    comment: BOM formatted for JLCPCB SMT assembly service
    type: bom
    dir: assembly/jlcpcb
    options:
      output: '%f_jlcpcb_bom.%x'
      ref_separator: ','
      group_components: true
      sort_style: type_value
      columns:
        - field: Value
          name: Comment
        - field: References
          name: Designator
        - field: Footprint
          name: Footprint
        - field: 'LCSC Part #'
          name: 'LCSC Part #'

  # JLCPCB CPL requires: Designator, Val, Package, Mid X, Mid Y, Rotation, Layer
  - name: jlcpcb_cpl
    comment: Component placement list for JLCPCB SMT assembly service
    type: position
    dir: assembly/jlcpcb
    options:
      output: '%f_jlcpcb_cpl.%x'
      format: CSV
      units: millimeters
      separate_files_for_front_and_back: false
      only_smd: true
      columns:
        - id: Ref
          name: Designator
        - id: Val
          name: Val
        - id: Package
          name: Package
        - id: PosX
          name: 'Mid X'
        - id: PosY
          name: 'Mid Y'
        - id: Rot
          name: Rotation
        - id: Side
          name: Layer

  # ── Interactive BOM (assembly aid) ───────────────────────────────────────────
  - name: ibom
    comment: Interactive HTML BOM for manual assembly verification
    type: ibom
    dir: assembly
    options:
      blacklist: 'DNP'
      name_format: '%f_ibom'

  # ── Gerber + drill zip for fab upload ────────────────────────────────────────
  - name: gerber_fab_zip
    comment: Gerber and drill files zipped for fab upload (JLCPCB/PCBWay)
    type: compress
    dir: fab
    options:
      output: '%f_gerbers.%x'
      files:
        - from_output: gerbers
          dest: /
        - from_output: drill
          dest: /

  # ── 3D renders ───────────────────────────────────────────────────────────────
  - name: render_top
    comment: 3D render – top view
    type: render_3d
    dir: 3d
    options:
      ray_tracing: true
      orthographic: false
      view: top

  - name: render_bottom
    comment: 3D render – bottom view
    type: render_3d
    dir: 3d
    options:
      ray_tracing: true
      orthographic: false
      view: bottom
