kibot:
  version: 1

preflight:
  # ERC and DRC are already run via kicad-cli steps; disable here to avoid
  # duplicate failures in the KiBot run.
  run_erc: false
  run_drc: false
  ignore_unconnected: false

outputs:
  # ── Gerber files (JLCPCB-compatible) ────────────────────────────────────────
  - name: gerbers
    comment: Gerber files for PCB fabrication
    type: gerber
    dir: gerbers
    options:
      exclude_edge_layer: true
      exclude_pads_from_silkscreen: false
      plot_sheet_reference: false
      plot_footprint_refs: true
      plot_footprint_values: true
      force_plot_invisible_refs_vals: false
      tent_vias: true
      use_protel_extensions: false
      gerber_precision: 4.6
      create_gerber_job_file: true
      use_gerber_x2_attributes: true
      use_gerber_net_attributes: true
    layers:
      - F.Cu
      - B.Cu
      - In1.Cu
      - In2.Cu
      - F.SilkS
      - B.SilkS
      - F.Mask
      - B.Mask
      - Edge.Cuts

  # ── Drill files ──────────────────────────────────────────────────────────────
  - name: drill
    comment: Drill/route files
    type: excellon
    dir: gerbers
    options:
      map: gerber
      pth_and_npth_single_file: false

  # ── Bill of Materials ────────────────────────────────────────────────────────
  - name: bom_csv
    comment: Bill of Materials (CSV with LCSC part numbers)
    type: bom
    dir: bom
    options:
      output: '%f_BOM.%x'
      ref_separator: ','
      group_components: true
      sort_style: type_value
      columns:
        - field: References
          name: References
        - field: Value
          name: Value
        - field: Quantity Per PCB
          name: Qty
        - Description
        - Footprint
        - field: 'LCSC Part #'
          name: 'LCSC Part #'

  # ── Schematic PDF ────────────────────────────────────────────────────────────
  - name: schematic_pdf
    comment: Schematic PDF export
    type: pdf_sch_print
    dir: docs

  # ── PCB layout PDF ───────────────────────────────────────────────────────────
  - name: pcb_pdf
    comment: PCB layout PDF (all copper layers)
    type: pdf_pcb_print
    dir: docs
    options:
      plot_sheet_reference: false
    layers:
      - layer: F.Cu
      - layer: B.Cu
      - layer: In1.Cu
      - layer: In2.Cu
      - layer: Edge.Cuts

  # ── Pick-and-place / assembly ────────────────────────────────────────────────
  - name: position
    comment: Component placement file (pick-and-place)
    type: position
    dir: assembly
    options:
      format: CSV
      units: millimeters
      separate_files_for_front_and_back: false

  # ── 3D renders ───────────────────────────────────────────────────────────────
  - name: render_top
    comment: 3D render – top view
    type: render_3d
    dir: 3d
    options:
      ray_tracing: true
      orthographic: false
      view: top

  - name: render_bottom
    comment: 3D render – bottom view
    type: render_3d
    dir: 3d
    options:
      ray_tracing: true
      orthographic: false
      view: bottom
